name: Release BootLens client starter

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to tag and publish, for example 1.0.0 or 1.0.0-rc1
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "Version input is required." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin." >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests before tagging
        env:
          BOOTLENS_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew test -PbootlensVersion=${BOOTLENS_VERSION}

      - name: Create annotated tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          BOOTLENS_VERSION: ${{ steps.version.outputs.version }}
        # Uploads a signed deployment to the Sonatype Central Portal. The deployment
        # is left in the "validated" state for manual review and release at
        # https://central.sonatype.com. Switch to publishAndReleaseToMavenCentral to
        # release automatically.
        run: ./gradlew publishToMavenCentral -PbootlensVersion=${BOOTLENS_VERSION}

      - name: Push release tag
        shell: bash
        run: git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="BootLens client starter ${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release for $TAG already exists. Skipping creation."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "## BootLens client starter released"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- Artifact: \`io.github.robbanhoglund:bootlens-client-spring-boot-starter:${{ steps.version.outputs.version }}\`"
            echo "- Maven Central: deployment uploaded to the Sonatype Central Portal (release manually at https://central.sonatype.com)"
            echo "- GitHub Release: created or reused for tag \`${{ steps.version.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
