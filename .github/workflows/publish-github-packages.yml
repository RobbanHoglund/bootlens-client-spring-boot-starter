name: Publish BootLens client starter

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# When the release-client-starter workflow triggers a release, it pushes a tag
# using the default GITHUB_TOKEN (actor = github-actions[bot]) AND publishes
# the artifact itself. Allowing this workflow to also run on that tag push
# would cause a duplicate publish. The condition below skips the run when the
# tag was created by the automated release workflow.


jobs:
  publish:
    # Skip when the tag was pushed by the automated release workflow to avoid
    # a duplicate publish. The release-client-starter.yml workflow already
    # publishes the artifact before pushing the tag.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Version tag is required." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          BOOTLENS_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew test -PbootlensVersion=${BOOTLENS_VERSION}

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          BOOTLENS_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew publish -PbootlensVersion=${BOOTLENS_VERSION}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="BootLens client starter ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release for $TAG already exists. Skipping creation."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes
