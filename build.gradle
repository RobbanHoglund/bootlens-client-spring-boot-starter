plugins {
	id 'java-library'
	// Applies maven-publish + signing and wires the Sonatype Central Portal.
	// Check for the latest plugin version before publishing.
	id 'com.vanniktech.maven.publish' version '0.36.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.robbanhoglund'
version = findProperty('bootlensVersion') ?: System.getenv('BOOTLENS_VERSION') ?: '0.0.1-SNAPSHOT'
description = 'BootLens client Spring Boot starter'

def githubProjectUrl = 'https://github.com/RobbanHoglund/bootlens-client-spring-boot-starter'
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def publishingToMavenLocal = requestedTaskNames.any {
	it == 'publishtomavenlocal' ||
		it.endsWith(':publishtomavenlocal') ||
		it == 'publishmavenpublicationtomavenlocal' ||
		it.endsWith(':publishmavenpublicationtomavenlocal')
}
def publishingToMavenCentral = requestedTaskNames.any { it.contains('mavencentral') }
def shouldSignPublications = !publishingToMavenLocal || publishingToMavenCentral

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	// Sources and Javadoc jars are added automatically by the maven.publish plugin.
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.6'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-autoconfigure'
	implementation 'me.bechberger:ap-loader-all:4.4-13'
	compileOnly 'org.springframework:spring-web'
	compileOnly 'jakarta.servlet:jakarta.servlet-api'
	// On the Javadoc classpath only, so javac can resolve @JsonInclude on referenced
	// Spring types and not emit "unknown enum constant Include.NON_EMPTY" notes.
	compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-web'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property('bootlensClientVersion', project.version.toString())
	inputs.property('bootlensClientArtifact', project.name)

	filesMatching('META-INF/bootlens-client.properties') {
		expand(version: project.version.toString(), artifact: project.name)
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

tasks.withType(Javadoc).configureEach {
	// The published Javadoc jar is a Maven Central requirement, not primary docs.
	// Disable doclint so missing @param/@return/comments don't flood the build, and
	// quiet the unrelated "unknown enum constant" notes from annotations that are not
	// on the Javadoc classpath (e.g. Jackson's @JsonInclude).
	options.addStringOption('Xdoclint:none', '-quiet')
}

mavenPublishing {
	// Publishes GPG-signed artifacts to the Sonatype Central Portal
	// (central.sonatype.com). Supply credentials and the signing key as Gradle
	// properties or environment variables (do NOT commit them):
	//   mavenCentralUsername / mavenCentralPassword       (Central Portal user token)
	//   signingInMemoryKey / signingInMemoryKeyPassword   (or the signing.* gpg props)
	publishToMavenCentral()
	if (shouldSignPublications) {
		signAllPublications()
	}

	coordinates(project.group.toString(), project.name, project.version.toString())

	pom {
		name = 'BootLens Client Spring Boot Starter'
		description = project.description
		url = githubProjectUrl

		licenses {
			license {
				name = 'Apache License, Version 2.0'
				url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
				distribution = 'repo'
			}
		}

		developers {
			developer {
				id = 'RobbanHoglund'
				name = 'Robert Höglund'
				url = githubProjectUrl
			}
		}

		scm {
			url = githubProjectUrl
			connection = "scm:git:${githubProjectUrl}.git"
			developerConnection = 'scm:git:ssh://git@github.com/RobbanHoglund/bootlens-client-spring-boot-starter.git'
		}
	}
}
