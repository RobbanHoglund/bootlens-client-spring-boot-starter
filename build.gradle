plugins {
	id 'java-library'
	id 'maven-publish'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bootlens'
version = findProperty('bootlensVersion') ?: System.getenv('BOOTLENS_VERSION') ?: '0.0.1-SNAPSHOT'
description = 'BootLens client Spring Boot starter'

def githubRepositorySlug = findProperty('githubRepository') ?: System.getenv('GITHUB_REPOSITORY')
def githubRepositoryTokens = githubRepositorySlug ? githubRepositorySlug.tokenize('/') : []
def githubPackagesOwner = findProperty('githubPackagesOwner') ?: System.getenv('GITHUB_REPOSITORY_OWNER') ?: (githubRepositoryTokens ? githubRepositoryTokens[0] : null)
def githubPackagesRepository = findProperty('githubPackagesRepository') ?: (githubRepositoryTokens.size() > 1 ? githubRepositoryTokens[1] : rootProject.name)
def githubPackagesUrl = (githubPackagesOwner && githubPackagesRepository)
	? uri("https://maven.pkg.github.com/${githubPackagesOwner}/${githubPackagesRepository}")
	: null
def scmRepositoryUrl = (githubPackagesOwner && githubPackagesRepository)
	? "https://github.com/${githubPackagesOwner}/${githubPackagesRepository}"
	: 'https://github.com/bootlens/bootlens-client-spring-boot-starter'
def scmConnectionUrl = scmRepositoryUrl.replace('https://github.com/', 'scm:git:https://github.com/') + '.git'
def scmDeveloperConnectionUrl = scmRepositoryUrl.replace('https://github.com/', 'scm:git:ssh://git@github.com/') + '.git'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withJavadocJar()
	withSourcesJar()
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.6'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-autoconfigure'
	implementation 'me.bechberger:ap-loader-all:4.4-13'
	compileOnly 'org.springframework:spring-web'
	compileOnly 'jakarta.servlet:jakarta.servlet-api'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-web'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	filesMatching('META-INF/bootlens-client.properties') {
		expand(version: project.version, artifact: project.name)
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
			groupId = project.group
			artifactId = project.name
			version = project.version

			versionMapping {
				allVariants {
					fromResolutionResult()
				}
			}

			pom {
				name = 'BootLens Client Spring Boot Starter'
				description = project.description
				url = scmRepositoryUrl

				licenses {
					license {
						name = 'Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
						distribution = 'repo'
					}
				}

				developers {
					developer {
						id = githubPackagesOwner ?: 'bootlens'
						name = githubPackagesOwner ?: 'BootLens'
						url = scmRepositoryUrl
					}
				}

				scm {
					url = scmRepositoryUrl
					connection = scmConnectionUrl
					developerConnection = scmDeveloperConnectionUrl
				}
			}
		}
	}

	repositories {
		if (githubPackagesUrl != null) {
			maven {
				name = 'GitHubPackages'
				url = githubPackagesUrl
				credentials {
					username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
					password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
				}
			}
		}
	}
}
