plugins {
	id 'java-library'
	// Applies maven-publish + signing and wires the Sonatype Central Portal.
	// Check for the latest plugin version before publishing.
	id 'com.vanniktech.maven.publish' version '0.36.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.robbanhoglund'
version = findProperty('bootlensVersion') ?: System.getenv('BOOTLENS_VERSION') ?: '0.0.1-SNAPSHOT'
description = 'BootLens client Spring Boot starter'

def githubProjectUrl = 'https://github.com/RobbanHoglund/bootlens-client-spring-boot-starter'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	// Sources and Javadoc jars are added automatically by the maven.publish plugin.
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.6'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-autoconfigure'
	implementation 'me.bechberger:ap-loader-all:4.4-13'
	compileOnly 'org.springframework:spring-web'
	compileOnly 'jakarta.servlet:jakarta.servlet-api'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-web'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	filesMatching('META-INF/bootlens-client.properties') {
		expand(version: project.version, artifact: project.name)
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

mavenPublishing {
	// Publishes GPG-signed artifacts to the Sonatype Central Portal
	// (central.sonatype.com). Supply credentials and the signing key as Gradle
	// properties or environment variables (do NOT commit them):
	//   mavenCentralUsername / mavenCentralPassword       (Central Portal user token)
	//   signingInMemoryKey / signingInMemoryKeyPassword   (or the signing.* gpg props)
	publishToMavenCentral()
	signAllPublications()

	coordinates(project.group.toString(), project.name, project.version.toString())

	pom {
		name = 'BootLens Client Spring Boot Starter'
		description = project.description
		url = githubProjectUrl

		licenses {
			license {
				name = 'Apache License, Version 2.0'
				url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
				distribution = 'repo'
			}
		}

		developers {
			developer {
				id = 'RobbanHoglund'
				name = 'Robert Höglund'
				url = githubProjectUrl
			}
		}

		scm {
			url = githubProjectUrl
			connection = "scm:git:${githubProjectUrl}.git"
			developerConnection = 'scm:git:ssh://git@github.com/RobbanHoglund/bootlens-client-spring-boot-starter.git'
		}
	}
}
